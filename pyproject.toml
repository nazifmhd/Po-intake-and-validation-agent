[project]
name = "po-agent"
version = "1.1.0"
description = "Purchase Order intake & validation agent: email -> extraction -> RAG validation -> routing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mohamed Nazif" }]
dependencies = [
    "langgraph>=0.2,<2",
    "fastapi>=0.110,<0.166",
    "uvicorn[standard]>=0.29,<0.55",
    "python-multipart>=0.0.9,<0.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "anthropic>=0.69,<3",
    "openai>=1.40,<4",
    "tenacity>=8.2,<10",
    "pymupdf>=1.24,<3",
    "pdfplumber>=0.11,<0.12",
    "pillow>=10.0,<14",
    "pytesseract>=0.3.10,<0.4",
    "chromadb>=0.5,<2",
    "fastembed>=0.3,<0.10",
    "rapidfuzz>=3.6,<4",
    "sqlmodel>=0.0.21,<0.1",
    "httpx>=0.27,<0.29",
    "streamlit>=1.50,<2",
    "pandas>=2.0,<4",
    "imap-tools>=1.6,<2",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0,<7"]
dev = ["pytest>=7.4,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
