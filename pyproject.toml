[project]
name = "po-agent"
version = "1.0.0"
description = "Purchase Order intake & validation agent: email -> extraction -> RAG validation -> routing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohamed Nazif" }]
dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.69",
    "openai>=1.40",
    "tenacity>=8.2",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "chromadb>=0.5",
    "fastembed>=0.3",
    "rapidfuzz>=3.6",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "streamlit>=1.46",
    "pandas>=2.0",
    "imap-tools>=1.6",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
